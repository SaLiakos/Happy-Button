<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Button</title>
<meta name="theme-color" content="#ff5a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Happy Button">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf1f7; --ink:#2a1f3d; --soft:#6b5d80; --card:#ffffff; --line:#f0d9e8;
  --b1:#ff5a6e; --b1d:#c9364a; --b2:#ff9f1c; --b2d:#c97300; --b3:#22b8a7; --b3d:#13877a;
  --b4:#ffcf33; --b4d:#c99a00; --b5:#4d8dff; --b5d:#2b5fc4; --b6:#9b5cf6; --b6d:#6a35c2;
  --gold:#ffcd4a; --goldd:#d99a00;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1c1530; --ink:#f7eefc; --soft:#b9a9cf; --card:#2a2142; --line:#3a2e57; }
}
:root[data-theme="dark"]{ --bg:#1c1530; --ink:#f7eefc; --soft:#b9a9cf; --card:#2a2142; --line:#3a2e57; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 48px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--b5);outline-offset:3px;border-radius:12px}

/* Home */
.hello{color:var(--soft);font-weight:600;margin:6px 0 2px}
.title{font-size:clamp(2.6rem,11vw,3.6rem);letter-spacing:-.01em;margin-bottom:6px}
.title span{display:inline-block}
.lead{color:var(--soft);margin:0 0 26px;max-width:32ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hb{--c:var(--b1);--d:var(--b1d);position:relative;border:0;cursor:pointer;background:var(--c);color:#fff;border-radius:28px;
  padding:20px 14px 18px;min-height:132px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;
  box-shadow:0 8px 0 var(--d),0 14px 24px -10px var(--d);transform:translateY(0);transition:transform .09s ease,box-shadow .09s ease;
  -webkit-tap-highlight-color:transparent}
.hb:active,.hb.pressed{transform:translateY(7px);box-shadow:0 1px 0 var(--d),0 4px 10px -6px var(--d)}
.hb .ic{font-size:2.3rem;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.hb .lb{font-family:var(--display);font-size:1.25rem;font-weight:600;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.hb.dark{color:#3b2a00}.hb.dark .lb{text-shadow:none}
.hb.wide{grid-column:1/-1;min-height:112px;flex-direction:row;align-items:center;gap:16px;
  background:radial-gradient(circle at 15% 30%,#fff3b0 0,transparent 45%),var(--c)}
.hb.wide .ic{font-size:2.8rem}
.hb.wide small{display:block;font-family:var(--body);font-weight:600;font-size:.92rem;opacity:.85;margin-top:2px}

/* Views */
.top{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.back{border:0;background:var(--card);width:46px;height:46px;border-radius:50%;font-size:1.3rem;cursor:pointer;box-shadow:0 3px 0 var(--line);flex:none}
.top h2{font-size:1.75rem}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 4px 0 var(--line)}
.btn{border:0;cursor:pointer;background:var(--c,var(--b5));color:#fff;font-family:var(--display);font-weight:600;font-size:1.1rem;
  border-radius:999px;padding:13px 24px;box-shadow:0 5px 0 var(--d,var(--b5d));transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d,var(--b5d))}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.muted{color:var(--soft)}
.small{font-size:.92rem}
.link{font-weight:700;text-decoration-thickness:2px;text-underline-offset:3px}

/* Recipes */
.rlist{display:grid;gap:10px;margin-top:16px}
.ritem{display:flex;align-items:center;gap:14px;border:0;background:var(--card);border-radius:20px;padding:10px 14px 10px 10px;text-align:left;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.ritem .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;flex:none}
.ritem b{font-family:var(--display);font-weight:600;font-size:1.08rem;display:block}
.plate{position:relative;aspect-ratio:16/10;border-radius:26px;overflow:hidden;display:grid;place-items:center;margin-bottom:18px}
.plate .disc{width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0,#f4f1f6 55%,#ddd6e3 100%);
  box-shadow:0 18px 30px -12px rgba(0,0,0,.45),inset 0 0 0 10px rgba(255,255,255,.6);display:grid;place-items:center;position:relative}
.plate .food{font-size:clamp(3.6rem,17vw,5.2rem);filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.plate .s1,.plate .s2{position:absolute;font-size:clamp(1.8rem,8vw,2.5rem);filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.plate .s1{left:10%;bottom:12%}.plate .s2{right:10%;top:12%}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.pill{background:var(--bg);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem}
.card h3{font-size:1.15rem;margin:18px 0 8px}
.card ul,.card ol{margin:0;padding-left:1.2em}
.card li{margin:5px 0}
.card ol li::marker{font-family:var(--display);font-weight:600;color:var(--b2d)}
.tip{background:#fff6d6;color:#4a3800;border-radius:18px;padding:14px 16px;margin-top:18px;font-weight:600}

/* Scenes / animals */
.scene{width:100%;display:block;border-radius:26px;box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.caption{font-family:var(--display);font-size:1.35rem;margin:16px 2px 4px}
.animal{border-radius:30px;aspect-ratio:4/5;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#fff;
  box-shadow:0 18px 34px -16px rgba(0,0,0,.5)}
.animal .halo{position:absolute;inset:0;background:radial-gradient(circle at 50% 31%,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 42%)}
.animal .rings{position:absolute;left:50%;top:31%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35);box-shadow:0 0 0 22px rgba(255,255,255,.08),0 0 0 48px rgba(255,255,255,.05)}
.animal .big{position:absolute;left:50%;top:31%;transform:translate(-50%,-50%);font-size:clamp(5.5rem,30vw,8.5rem);
  filter:drop-shadow(0 0 24px rgba(255,255,255,.75)) drop-shadow(0 10px 14px rgba(0,0,0,.25));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translate(-50%,-56%)}}
.animal h3{font-size:1.7rem;position:relative;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.animal p{position:relative;margin:6px 0 0;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.animal a{position:relative;margin-top:12px;font-weight:700;color:#fff}

/* Jokes */
.joke{font-family:var(--display);font-weight:500;font-size:1.35rem;line-height:1.45;min-height:7em}
.joke-wrap{background:var(--b4);color:#3b2a00;border-radius:30px;padding:28px 24px;box-shadow:0 8px 0 var(--b4d);position:relative}
.joke-wrap::before{content:"😄";position:absolute;right:18px;top:-22px;font-size:2.6rem}

/* Trips */
.trip{background:var(--b3);color:#fff;border-radius:30px;padding:26px 22px;box-shadow:0 8px 0 var(--b3d)}
.trip .ic{font-size:3.4rem}
.trip h3{font-size:1.6rem;margin:10px 0 8px}
.trip p{margin:8px 0}

/* News */
.news{display:grid;gap:14px}
.ncard{background:var(--card);border-radius:22px;padding:18px 18px 16px;box-shadow:0 3px 0 var(--line);border-left:8px solid var(--nc,var(--b5))}
.ncard h3{font-size:1.18rem;margin:6px 0 6px}
.ncard p{margin:0 0 8px}
.tag{font-size:.82rem;font-weight:700;color:var(--soft)}
.promptbox{margin-top:22px;background:var(--b6);color:#fff;border-radius:26px;padding:22px;box-shadow:0 7px 0 var(--b6d)}
.promptbox h3{font-size:1.3rem;margin-bottom:6px}
.promptbox textarea{width:100%;min-height:150px;border:0;border-radius:16px;padding:12px;font:inherit;font-size:.9rem;margin-top:12px;background:rgba(255,255,255,.92);color:#2a1f3d;resize:vertical}

/* Glückskind */
.gk{background:var(--gold);color:#3b2a00;border-radius:30px;padding:24px 22px;box-shadow:0 8px 0 var(--goldd)}
.gk h3{font-size:1.45rem;margin-bottom:4px}
.gk textarea{width:100%;min-height:96px;border:0;border-radius:18px;padding:14px;font:inherit;margin-top:14px;background:#fffbea;color:#2a1f3d;resize:vertical}
.gk .btn{--c:#ff7a3d;--d:#c4501a}
.count{font-family:var(--display);font-size:1.15rem;margin:26px 2px 12px}
.entries{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.entry{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 3px 0 var(--line);display:flex;gap:10px;align-items:flex-start}
.entry .when{font-size:.82rem;font-weight:700;color:var(--soft)}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.entry .del{margin-left:auto;border:0;background:transparent;color:var(--soft);font-size:1.1rem;cursor:pointer;padding:2px 6px;border-radius:8px}
.empty{background:var(--card);border-radius:20px;padding:18px;color:var(--soft)}
.flash{background:#fff6d6;color:#4a3800;border-radius:22px;padding:18px;margin-top:16px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:#2a1f3d;color:#fff;
  padding:10px 18px;border-radius:999px;font-weight:700;transition:.25s;pointer-events:none;z-index:9}
.toast.on{transform:translate(-50%,0);opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.photo{width:100%;display:block;object-fit:cover;border-radius:26px;opacity:0;transition:opacity .5s;box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.photo.in{opacity:1}
.plate .photo{position:absolute;inset:0;height:100%;border-radius:0;box-shadow:none}
.credit{font-size:.78rem;color:var(--soft);margin:8px 4px 0}
.credit a{color:inherit}
.animal.hasphoto{background-size:cover!important;background-position:center!important}
.animal.hasphoto .big,.animal.hasphoto .rings,.animal.hasphoto .halo{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 16px}
.chip{border:0;cursor:pointer;border-radius:999px;padding:8px 14px;font-weight:700;background:var(--card);box-shadow:0 3px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--b3);color:#fff;box-shadow:0 3px 0 var(--b3d)}
.trip .cat{display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem;margin-left:8px;vertical-align:middle}
@media (prefers-reduced-motion: reduce){ .animal .big{animation:none} .confetti{display:none} .hb,.btn{transition:none} }
@media (max-width:360px){ .grid{gap:12px} .hb{min-height:118px;padding:16px 12px} .hb .lb{font-size:1.1rem} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== HIER DEINEN UNSPLASH-SCHLÜSSEL EINTRAGEN (zwischen die Anführungszeichen) ===== */
const UNSPLASH_KEY = "HIER_SCHLUESSEL_EINFUEGEN";
/* ================================================================================ */
const RECIPES = [
{t:"Die perfekte Bolognese",e:["🍝","🍅","🌿"],c:["#ff6b5e","#c2372b"],time:"2,5 Std.",serv:"4 Portionen",
ing:["500 g Rinderhack (oder halb Rind, halb Schwein)","100 g Pancetta, fein gewürfelt","1 Zwiebel, 1 Möhre, 1 Stange Staudensellerie – alles sehr fein gewürfelt","2 Knoblauchzehen","2 EL Tomatenmark","150 ml trockener Rotwein","800 g San-Marzano-Tomaten aus der Dose","200 ml Rinderbrühe","100 ml laktosefreie Milch","1 Lorbeerblatt, Salz, Pfeffer, frisch geriebene Muskatnuss","400 g Tagliatelle","Parmesan zum Servieren (lange gereift, von Natur aus laktosefrei)"],
steps:["Pancetta in einem schweren Topf bei mittlerer Hitze auslassen, bis das Fett glänzt.","Zwiebel, Möhre und Sellerie dazugeben und 10 Minuten sanft glasig schwitzen – das ist das Aroma-Fundament.","Hitze hoch, Hack in zwei Portionen dazugeben und so lange braten, bis es richtig braun und krümelig ist. Geduld lohnt sich hier am meisten.","Knoblauch und Tomatenmark 2 Minuten mitrösten, dann mit Rotwein ablöschen und fast vollständig einkochen lassen.","Tomaten (mit der Hand zerdrückt), Brühe und Lorbeer zugeben. Halb zugedeckt 2 Stunden ganz leise blubbern lassen, ab und zu umrühren.","Die laktosefreie Milch einrühren und weitere 15 Minuten köcheln – so wird die Sauce samtig und rund. Mit Salz, Pfeffer und Muskat abschmecken.","Tagliatelle al dente kochen, direkt in der Sauce mit einer Kelle Nudelwasser schwenken und mit Parmesan servieren."],
tip:"Der Schuss Milch ist das Geheimnis der Original-Rezeptur aus Bologna. Am nächsten Tag schmeckt sie sogar noch besser."},
{t:"Zucchini-Pilz-Nudeln",e:["🍄","🥒","🍝"],c:["#8fd16a","#3f8a3a"],time:"25 Min.",serv:"3 Portionen",
ing:["300 g Linguine oder Penne","2 Zucchini, in Halbmonden","300 g braune Champignons, in Scheiben","1 Schalotte, 2 Knoblauchzehen","150 ml laktosefreie Sahne (oder Hafer-Cuisine)","1 Bio-Zitrone (Abrieb und etwas Saft)","3 Zweige Thymian","40 g Parmesan, gerieben","2 EL Pinienkerne","Olivenöl, Salz, Pfeffer"],
steps:["Pinienkerne ohne Fett goldbraun rösten und beiseitestellen.","Pasta in kräftig gesalzenem Wasser kochen, eine Tasse Nudelwasser aufheben.","Pilze in einer sehr heißen Pfanne mit Öl braten – nicht zu viele auf einmal und nicht ständig rühren, damit sie richtig braun werden. Erst jetzt salzen.","Zucchini dazugeben und 4 Minuten mitbraten, bis sie Farbe haben, aber noch Biss.","Schalotte, Knoblauch und Thymian 1 Minute mitschwenken, dann Sahne und einen Schuss Nudelwasser angießen.","Pasta hineingeben, Parmesan und Zitronenabrieb unterschwenken, bis alles cremig glänzt.","Mit Pfeffer, einem Spritzer Zitrone und den Pinienkernen servieren."],
tip:"Pilze erst salzen, wenn sie braun sind – sonst ziehen sie Wasser und kochen statt zu rösten."},
{t:"Glücklich-mach-Pfannkuchen",e:["🥞","🍓","🍯"],c:["#ffd56b","#e09a1f"],time:"25 Min.",serv:"ca. 12 Stück",
ing:["200 g Mehl","2 TL Backpulver","1 EL Zucker und 1 Päckchen Vanillezucker","1 Prise Salz","2 Eier, getrennt","250 ml laktosefreie Milch","30 g laktosefreie Butter, geschmolzen (plus etwas zum Braten)","Zum Toppen: Ahornsirup, Beeren, Bananenscheiben"],
steps:["Mehl, Backpulver, Zucker, Vanillezucker und Salz in einer Schüssel mischen.","Eiweiß mit einer Prise Salz steif schlagen – das ist der Fluffig-Trick.","Eigelb, Milch und geschmolzene Butter verquirlen und nur kurz mit den trockenen Zutaten verrühren. Kleine Klümpchen sind völlig in Ordnung.","Eischnee vorsichtig unterheben und den Teig 5 Minuten ruhen lassen.","Pfanne auf mittlere Hitze bringen, dünn einfetten und kleine Kellen Teig hineingeben.","Wenden, sobald sich oben Bläschen bilden, und noch 1 Minute goldbraun backen.","Hoch stapeln, mit Ahornsirup beträufeln und mit Beeren krönen."],
tip:"Je weniger du rührst, desto luftiger werden sie. Warm gehalten im Ofen bei 80 °C bleiben sie perfekt, bis alle fertig sind."},
{t:"Oreo-Erdbeer-Traum",e:["🍓","🍪","🍨"],c:["#ff8fab","#c9184a"],time:"20 Min. + 1 Std. kühlen",serv:"6 Gläser",
ing:["500 g Erdbeeren","1 Packung Oreo Original (154 g) – laut Zutatenliste ohne Milch, bitte Packung kurz prüfen","250 g laktosefreier Mascarpone","250 g laktosefreier Quark","200 ml laktosefreie Sahne","2 EL Puderzucker, 1 Päckchen Vanillezucker","1 EL Zucker und ein Spritzer Zitronensaft für die Erdbeeren"],
steps:["Erdbeeren klein schneiden, mit Zucker und Zitronensaft mischen und 10 Minuten ziehen lassen – so werden sie saftig.","Oreos in einem Gefrierbeutel mit dem Nudelholz grob zerbröseln (ein paar größere Stücke lassen).","Mascarpone, Quark, Puderzucker und Vanillezucker glatt rühren.","Sahne steif schlagen und locker unter die Creme heben.","In Gläser schichten: Oreo-Brösel, Creme, Erdbeeren – und das Ganze noch einmal.","Mindestens 1 Stunde kühlen und erst kurz vorm Servieren mit Bröseln und einer halben Erdbeere krönen."],
tip:"Ein paar Oreo-Brösel für obendrauf zurückbehalten – dann bleibt der Crunch."},
{t:"Super-Happy-Crunch-Dessert",e:["🫐","🥣","✨"],c:["#a78bfa","#5b21b6"],time:"20 Min.",serv:"4 Gläser",
ing:["80 g Haferflocken","40 g Haselnüsse, grob gehackt","30 g Mandelblättchen","2 EL Ahornsirup, 1 EL Kokosöl","1 TL Zimt und 1 kräftige Prise Salz","400 g laktosefreier Joghurt griechischer Art (oder laktosefreier Skyr)","1 EL Honig und etwas Vanille","250 g gemischte Beeren","40 g Zartbitterschokolade (ohne Milchbestandteile), gehackt"],
steps:["Haferflocken, Nüsse, Mandeln, Ahornsirup, Kokosöl, Zimt und Salz in einer Pfanne mischen.","Bei mittlerer Hitze 6–8 Minuten unter Rühren rösten, bis alles goldbraun ist und herrlich duftet.","Auf Backpapier verteilen und abkühlen lassen – erst dann wird es richtig knusprig.","Joghurt mit Honig und Vanille glatt rühren.","Schichten: Joghurt, Beeren, Crunch – und oben mit Schokostückchen und noch mehr Crunch abschließen."],
tip:"Die Prise Salz macht aus dem Crunch fast schon Karamell. Den Rest in einem Glas aufbewahren – hält eine Woche."},
{t:"Bunter Ofengemüse-Traum",e:["🫑","🍠","🍅"],c:["#ffb347","#d9480f"],time:"45 Min.",serv:"3–4 Portionen",
ing:["1 Süßkartoffel","je 1 rote und gelbe Paprika","1 Zucchini","1 rote Zwiebel","250 g Kirschtomaten","1 Dose Kichererbsen, abgetropft und trockengetupft","4 EL Olivenöl","1 TL geräuchertes Paprikapulver, 1 TL Kreuzkümmel","2 Knoblauchzehen, Salz, Pfeffer","Dip: 200 g laktosefreier Joghurt, Zitronensaft, 1 Knoblauchzehe, Kräuter","Frische Petersilie"],
steps:["Ofen auf 220 °C Ober-/Unterhitze vorheizen.","Süßkartoffel etwas kleiner schneiden als das restliche Gemüse – sie braucht am längsten.","Alles Gemüse und die Kichererbsen mit Öl, Gewürzen, Salz und Pfeffer gut vermengen.","Auf zwei Bleche verteilen, sodass nichts übereinanderliegt.","30–35 Minuten rösten, nach der Hälfte einmal wenden, bis die Ränder karamellisiert sind.","Für den Dip Joghurt mit Zitrone, Knoblauch, Kräutern und Salz verrühren.","Gemüse mit Petersilie und einem Spritzer Zitrone servieren, Dip dazu."],
tip:"Platz auf dem Blech ist das Geheimnis: Zu eng gestapelt dämpft das Gemüse, mit Abstand röstet es."},
{t:"Ofen-Fenchel mit Parmesan",e:["🌿","🧀","🍋"],c:["#c5e99b","#5c8d2d"],time:"40 Min.",serv:"2–3 Portionen",
ing:["2 große Fenchelknollen","3 EL Olivenöl","60 g Parmesan, fein gerieben (lange gereift, von Natur aus laktosefrei)","2 EL Panko oder Semmelbrösel","Abrieb von 1 Bio-Zitrone","1 Knoblauchzehe, fein gerieben","Salz, Pfeffer, nach Lust Chiliflocken"],
steps:["Ofen auf 200 °C vorheizen.","Fenchel in 1,5 cm dicke Spalten schneiden, der Strunk hält sie zusammen. Das Grün aufheben.","Spalten mit Öl, Salz und Pfeffer auf ein Blech legen und 20 Minuten vorbacken.","Parmesan, Panko, Zitronenabrieb und Knoblauch mischen.","Über den Fenchel streuen und weitere 12–15 Minuten backen, bis die Kruste goldbraun ist.","Mit Fenchelgrün, einem Spritzer Zitrone und nach Lust Chiliflocken servieren."],
tip:"Der Fenchel wird im Ofen mild und fast süß – auch Fenchel-Skeptiker werden hier oft schwach."},
{t:"Teriyaki-Hähnchen-Bowl",e:["🍚","🍗","🥑"],c:["#ffcf70","#b5651d"],time:"35 Min.",serv:"4 Portionen",
ing:["500 g Hähnchenschenkel ohne Knochen","Sauce: 4 EL Sojasauce, 2 EL Mirin, 1 EL Reisessig, 2 EL Honig, 1 TL geriebener Ingwer, 1 Knoblauchzehe","1 TL Speisestärke in 2 EL Wasser","250 g Jasmin- oder Sushireis","1 Gurke, 1 Avocado, 1 Möhre","150 g Edamame (TK)","Frühlingszwiebeln, Sesam, ein paar Tropfen Sesamöl"],
steps:["Reis nach Packung kochen.","Gurke in dünne Scheiben schneiden und mit einem Schuss Reisessig und einer Prise Zucker marinieren. Möhre in feine Streifen, Avocado in Scheiben schneiden. Edamame kurz kochen.","Sauce-Zutaten verrühren.","Hähnchen in mundgerechte Stücke schneiden und in etwas Öl 6–8 Minuten rundum knusprig braten.","Sauce angießen, Stärke einrühren und alles 2 Minuten einköcheln, bis das Hähnchen glänzt.","Reis in Schalen geben, Gemüse und Hähnchen darauf anrichten und mit Frühlingszwiebeln, Sesam und Sesamöl toppen."],
tip:"Hähnchenschenkel bleiben viel saftiger als Brust und vertragen die Hitze besser."},
{t:"Wohlfühl-Ramen",e:["🍜","🥚","🍥"],c:["#ff9f68","#a23e1f"],time:"45 Min. + Eier marinieren",serv:"4 Schalen",
ing:["1,2 l Hühnerbrühe","3 EL Sojasauce, 2 EL helle Miso-Paste, 1 EL Sesamöl","3 cm Ingwer in Scheiben, 2 Knoblauchzehen","4 Eier","Marinade: 3 EL Sojasauce, 1 EL Mirin, 3 EL Wasser","250 g Ramen-Nudeln","200 g Shiitake oder Champignons","2 Pak Choi, halbiert","1 Hähnchenbrust oder 300 g Tofu","Frühlingszwiebeln, Nori, Sesam, Chiliöl"],
steps:["Eier genau 6 ½ Minuten kochen, eiskalt abschrecken, schälen und mindestens 1 Stunde in der Marinade ziehen lassen.","Brühe mit Ingwer, Knoblauch und Pilzen aufkochen und 15 Minuten leise ziehen lassen.","Hähnchenbrust darin 12–15 Minuten gar ziehen lassen, herausnehmen und in Scheiben schneiden.","Hitze herunterdrehen, Miso und Sojasauce einrühren – ab jetzt nicht mehr kochen.","Pak Choi 2 Minuten in der Brühe garen.","Nudeln separat kochen und auf Schalen verteilen, heiße Brühe darübergießen.","Mit Hähnchen, halbierten Eiern, Pak Choi, Frühlingszwiebeln, Nori, Sesam und Chiliöl anrichten."],
tip:"Miso nie kochen lassen – so bleibt sein volles, rundes Aroma erhalten."},
{t:"Geröstete Tomaten-Paprika-Suppe",e:["🍅","🫑","🌿"],c:["#ff7a59","#b02e0c"],time:"55 Min.",serv:"4 Portionen",
ing:["1 kg reife Tomaten, halbiert","2 rote Paprika, grob geschnitten","1 Zwiebel, geviertelt","3 Knoblauchzehen in der Schale","3 EL Olivenöl","500 ml Gemüsebrühe","1 TL Zucker, 1 TL geräuchertes Paprikapulver","100 ml Kokosmilch oder laktosefreie Sahne","Salz, Pfeffer","Basilikumöl: 1 Bund Basilikum, 80 ml Olivenöl, 1 Prise Salz"],
steps:["Ofen auf 220 °C vorheizen.","Tomaten, Paprika, Zwiebel und Knoblauch mit Öl, Salz und Zucker auf einem Blech 35 Minuten rösten, bis die Ränder dunkel werden.","Knoblauch aus der Schale drücken und alles mit der Brühe in einen Topf geben, 10 Minuten köcheln.","Fein pürieren, Kokosmilch oder Sahne einrühren und mit Paprikapulver, Salz und Pfeffer abschmecken.","Für das Basilikumöl alles kurz fein mixen.","Suppe in Schalen füllen, mit grünem Basilikumöl beträufeln und mit geröstetem Brot servieren."],
tip:"Das Rösten im Ofen macht die Suppe süß, tief und ein bisschen rauchig – ganz anders als nur gekocht."},
{t:"Zitronen-Knoblauch-Hähnchen vom Blech",e:["🍗","🍋","🥔"],c:["#ffe066","#b08900"],time:"60 Min.",serv:"4 Portionen",
ing:["1 kg Hähnchenschenkel mit Haut","800 g kleine Kartoffeln, halbiert","1 Bio-Zitrone in Scheiben","1 ganze Knoblauchknolle, in Zehen geteilt","je 3 Zweige Rosmarin und Thymian","4 EL Olivenöl, 1 TL Paprika edelsüß","100 ml Weißwein oder Hühnerbrühe","Salz, Pfeffer"],
steps:["Ofen auf 210 °C vorheizen.","Kartoffeln mit 2 EL Öl und Salz auf einem tiefen Blech verteilen.","Hähnchen gründlich trockentupfen, mit Öl, Paprika, Salz und Pfeffer einreiben und mit der Haut nach oben auf die Kartoffeln legen.","Zitronenscheiben, Knoblauchzehen und Kräuter dazwischen verteilen, Wein angießen.","45–50 Minuten backen, bis die Haut goldbraun und knusprig ist.","Vor dem Servieren mit dem Bratensaft vom Blech beträufeln."],
tip:"Je trockener die Haut vor dem Backen, desto knuspriger wird sie."},
{t:"Shakshuka",e:["🍳","🍅","🌶️"],c:["#ff6f61","#9e2a2b"],time:"30 Min.",serv:"2–3 Portionen",
ing:["2 EL Olivenöl","1 Zwiebel, 1 rote Paprika","3 Knoblauchzehen","1 TL Kreuzkümmel, 1 TL geräuchertes Paprikapulver, 1 Prise Chili","800 g gehackte Tomaten, 1 TL Zucker","4–6 Eier","Petersilie oder Koriander","Laktosefreier Joghurt mit etwas Zitrone","Fladenbrot, Salz, Pfeffer"],
steps:["Zwiebel und Paprika in Öl 8 Minuten weich braten.","Knoblauch und Gewürze 1 Minute mitrösten, bis es duftet.","Tomaten und Zucker zugeben und 10–15 Minuten dicklich einkochen. Kräftig abschmecken.","Mit einem Löffel Mulden formen und die Eier hineingleiten lassen.","Deckel drauf und 6–8 Minuten garen, bis das Eiweiß fest und das Eigelb noch flüssig ist.","Mit Kräutern, einem Klecks Zitronen-Joghurt und warmem Fladenbrot direkt aus der Pfanne essen."],
tip:"Perfekt für ein gemütliches Wochenend-Frühstück – das Brot zum Tunken ist Pflicht."},
{t:"Honig-Senf-Lachs vom Blech",e:["🐟","🍯","🥦"],c:["#ffa69e","#c0574a"],time:"35 Min.",serv:"4 Portionen",
ing:["4 Lachsfilets à ca. 150 g","Glasur: 2 EL Dijon-Senf, 1 EL körniger Senf, 2 EL Honig, 1 EL Sojasauce, 1 Knoblauchzehe","600 g Drillinge, halbiert","500 g grüner Spargel oder Brokkoli","Olivenöl, Salz, Pfeffer","Dill und Zitrone"],
steps:["Ofen auf 220 °C vorheizen. Kartoffeln mit Öl und Salz 20 Minuten vorbacken.","Glasur verrühren.","Gemüse mit etwas Öl und Salz zu den Kartoffeln geben, Lachs dazwischenlegen und großzügig mit der Glasur bestreichen.","10–12 Minuten backen, bis der Lachs innen gerade noch glasig ist.","Mit Dill und Zitronenspalten servieren."],
tip:"Lieber eine Minute zu kurz als zu lang – innen leicht glasig ist Lachs am zartesten."},
{t:"Kürbis-Kokos-Suppe",e:["🎃","🥥","🌶️"],c:["#ffb84d","#c25e00"],time:"40 Min.",serv:"4 Portionen",
ing:["1 Hokkaido-Kürbis (ca. 1 kg) – die Schale bleibt dran","1 Zwiebel, 1 Knoblauchzehe, 3 cm Ingwer","1 EL rote Currypaste","1 Dose Kokosmilch (400 ml)","600 ml Gemüsebrühe","1 Limette","Kürbiskerne, Koriander, Chiliflocken, Salz"],
steps:["Kürbis entkernen und würfeln.","Zwiebel, Knoblauch und Ingwer in etwas Öl anschwitzen, Currypaste 1 Minute mitrösten.","Kürbis und Brühe zugeben und 20 Minuten weich köcheln.","Kokosmilch einrühren (2 EL zum Garnieren aufheben) und alles fein pürieren.","Mit Limettensaft und Salz abschmecken.","Kürbiskerne mit einer Prise Salz in der Pfanne rösten und die Suppe mit Kokos-Klecks, Kernen, Koriander und Chili servieren."],
tip:"Der Limettensaft am Ende macht aus einer guten Suppe eine, die richtig strahlt."},
{t:"Cremiges Pilzrisotto",e:["🍄","🍚","🧀"],c:["#d9b38c","#7a5230"],time:"40 Min.",serv:"4 Portionen",
ing:["300 g Risottoreis (Carnaroli oder Arborio)","400 g gemischte Pilze","1 Schalotte, 2 Knoblauchzehen","150 ml trockener Weißwein","1,2 l heiße Brühe","40 g laktosefreie Butter, kalt","60 g Parmesan (von Natur aus laktosefrei)","Thymian, Petersilie, Olivenöl, Salz, Pfeffer"],
steps:["Pilze portionsweise in heißem Öl scharf anbraten, salzen und beiseitestellen.","Schalotte und Knoblauch im selben Topf glasig schwitzen, Reis zugeben und 2 Minuten anrösten, bis er leicht glasig ist.","Mit Wein ablöschen und verkochen lassen.","Heiße Brühe kellenweise zugießen und immer wieder rühren, ca. 18 Minuten.","Pilze und Thymian unterheben.","Herd aus: kalte Butter und Parmesan kräftig einrühren, Deckel drauf, 2 Minuten ruhen lassen.","Mit Petersilie und Pfeffer servieren – es soll wellenartig fließen."],
tip:"Das kräftige Einrühren von Butter und Käse am Schluss heißt „mantecatura“ – das macht es so cremig."},
{t:"Pasta mit frischem Basilikum-Pesto",e:["🌿","🍝","🥜"],c:["#7bd389","#2d6a4f"],time:"20 Min.",serv:"4 Portionen",
ing:["400 g Trofie oder Spaghetti","60 g Basilikumblätter (ca. 2 Bund)","40 g Pinienkerne","1 kleine Knoblauchzehe","60 g Parmesan, fein gerieben (von Natur aus laktosefrei)","120 ml mildes Olivenöl","Salz","Optional: 150 g Kirschtomaten, halbiert"],
steps:["Pinienkerne ohne Fett hellgolden rösten und abkühlen lassen.","Pinienkerne, Knoblauch und Salz im Mixer oder Mörser fein zerkleinern.","Basilikum und einen Eiswürfel dazugeben und nur kurz pulsen.","Parmesan und Öl unterrühren.","Pasta kochen, abgießen und mit dem Pesto und 3–4 EL Nudelwasser in einer Schüssel verrühren, bis es cremig wird.","Nach Lust mit Kirschtomaten und extra Parmesan servieren."],
tip:"Pesto nie in die heiße Pfanne geben – Hitze macht es braun und bitter."},
{t:"Chili sin Carne",e:["🌶️","🫘","🥑"],c:["#ff5d5d","#8b1e1e"],time:"55 Min.",serv:"4–6 Portionen",
ing:["2 EL Öl, 2 Zwiebeln, 3 Knoblauchzehen","1 rote Paprika, 1 Süßkartoffel","je 2 TL Kreuzkümmel und geräuchertes Paprikapulver, 1 TL Oregano, ½ TL Zimt, Chili nach Geschmack","2 EL Tomatenmark","800 g gehackte Tomaten","2 Dosen Kidney- oder schwarze Bohnen","1 kleine Dose Mais","20 g Zartbitterschokolade (ohne Milchbestandteile)","1 Limette","Toppings: Avocado, Koriander, laktosefreier Joghurt, Tortilla-Chips"],
steps:["Zwiebeln, Paprika und Süßkartoffel in Öl 8 Minuten anbraten.","Knoblauch, Gewürze und Tomatenmark 2 Minuten mitrösten.","Tomaten, Bohnen und Mais zugeben, 300 ml Wasser angießen.","Zugedeckt 30–40 Minuten köcheln, bis die Süßkartoffel zerfällt und das Chili dick ist.","Schokolade einrühren und mit Limettensaft und Salz abschmecken.","Mit Avocado, Koriander, Joghurt und Chips servieren."],
tip:"Ein Stück Schokolade und eine Prise Zimt geben dem Chili diese geheimnisvolle Tiefe."},
{t:"Saftiges Bananenbrot",e:["🍌","🍞","🌰"],c:["#ffe08a","#a87b00"],time:"75 Min.",serv:"1 Kastenform",
ing:["3 sehr reife Bananen (plus 1 halbe zum Belegen)","2 Eier","80 ml neutrales Öl oder 80 g laktosefreie Butter, geschmolzen","100 g brauner Zucker","1 TL Vanille","220 g Mehl","1 TL Natron, 1 TL Backpulver","½ TL Zimt, 1 Prise Salz","80 g Walnüsse oder Zartbitterschokolade (ohne Milchbestandteile)"],
steps:["Ofen auf 175 °C vorheizen, Kastenform mit Backpapier auslegen.","Bananen mit der Gabel zerdrücken.","Eier, Öl, Zucker und Vanille unterrühren.","Mehl, Natron, Backpulver, Zimt und Salz mischen und nur so lange unterheben, bis kein Mehl mehr zu sehen ist.","Nüsse oder Schokolade unterheben, Teig in die Form füllen und die halbe Banane längs obenauf legen.","55–60 Minuten backen (Stäbchenprobe) und in der Form etwas abkühlen lassen."],
tip:"Je brauner die Bananen, desto süßer und saftiger das Brot."},
{t:"Mousse au Chocolat",e:["🍫","🍓","✨"],c:["#9c6644","#3e2215"],time:"25 Min. + 4 Std. kühlen",serv:"6 Portionen",
ing:["200 g Zartbitterschokolade (60–70 %, ohne Milchbestandteile)","4 sehr frische Eier","2 EL Zucker","1 Prise Salz","200 ml laktosefreie Sahne","Optional: 1 EL Espresso","Fleur de Sel und Himbeeren zum Servieren"],
steps:["Schokolade über dem Wasserbad schmelzen und lauwarm abkühlen lassen.","Eier trennen. Eigelb mit 1 EL Zucker cremig schlagen, Schokolade und Espresso einrühren.","Sahne halbsteif schlagen und unterheben.","Eiweiß mit Salz steif schlagen, restlichen Zucker einrieseln lassen.","Eischnee in drei Portionen ganz vorsichtig unterheben, damit die Luft drin bleibt.","Mindestens 4 Stunden kühlen und mit einem Hauch Fleur de Sel und Himbeeren servieren."],
tip:"Enthält rohe Eier – für Schwangere und kleine Kinder deshalb nicht geeignet."},
{t:"Knusprige Gnocchi mit Kirschtomaten",e:["🥔","🍅","🌿"],c:["#ffb3a7","#c44536"],time:"20 Min.",serv:"3–4 Portionen",
ing:["800 g Gnocchi aus dem Kühlregal (Zutaten prüfen, meist ohne Milch)","400 g Kirschtomaten","2 Knoblauchzehen, in Scheiben","3 EL Olivenöl","1 Handvoll Basilikum","40 g Parmesan (von Natur aus laktosefrei)","Abrieb von ½ Bio-Zitrone","Salz, Pfeffer"],
steps:["Gnocchi nicht kochen! Direkt in einer großen Pfanne mit 2 EL Öl in zwei Portionen 8–10 Minuten rundum goldbraun braten.","Gnocchi herausnehmen. Restliches Öl, Tomaten und Knoblauch in die Pfanne geben und 5 Minuten braten, bis die Tomaten platzen.","Gnocchi zurück in die Pfanne geben und alles schwenken.","Mit Basilikum, Parmesan, Zitronenabrieb, Salz und Pfeffer servieren."],
tip:"Außen knusprig, innen fluffig – angebraten statt gekocht schmecken Gnocchi wie kleine Kartoffelkissen."}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1900)}
function bag(n){let order=[],last=-1;return ()=>{if(!order.length){order=[...Array(n).keys()].sort(()=>Math.random()-.5);if(order[0]===last&&n>1)order.push(order.shift())}last=order.shift();return last}}

const HAS_KEY=typeof UNSPLASH_KEY==="string"&&UNSPLASH_KEY.length>20&&!UNSPLASH_KEY.startsWith("HIER");
let RT=0;
async function unsplash(query,orient,cacheKey){
 if(!HAS_KEY)return null;
 if(cacheKey){try{const c=JSON.parse(localStorage.getItem("ph:"+cacheKey)||"null");if(c&&c.src)return c}catch(e){}}
 try{
  const r=await fetch("https://api.unsplash.com/photos/random?query="+encodeURIComponent(query)+"&orientation="+orient+"&content_filter=high",{headers:{"Authorization":"Client-ID "+UNSPLASH_KEY,"Accept-Version":"v1"}});
  if(!r.ok)return null;
  const j=await r.json();
  const ph={src:j.urls.regular,alt:j.alt_description||query,name:j.user.name,user:j.user.links.html};
  if(cacheKey){try{localStorage.setItem("ph:"+cacheKey,JSON.stringify(ph))}catch(e){}}
  return ph;
 }catch(e){return null}
}
function credit(ph){const u="?utm_source=happy_button&utm_medium=referral";return `<p class="credit">Foto: <a target="_blank" rel="noopener" href="${ph.user}${u}">${esc(ph.name)}</a> auf <a target="_blank" rel="noopener" href="https://unsplash.com/${u}">Unsplash</a></p>`}
function imgTag(ph){return `<img class="photo" src="${ph.src}" alt="${esc(ph.alt)}" onload="this.classList.add('in')">`}
function loadPhoto(query,orient,cacheKey,apply){const t=RT;unsplash(query,orient,cacheKey).then(ph=>{if(ph&&t===RT)apply(ph)})}

 $app.innerHTML=topBar("Glückskind")+`<div class="gk"><h3>Wo hattest du heute Glück?</h3>
 <p style="margin:0">Auch kleine Dinge zählen: ein Lächeln, ein freier Parkplatz, die perfekte Tasse Kaffee.</p>
 <label for="gtxt" class="small" style="position:absolute;left:-9999px">Dein Glücksmoment</label>
 <textarea id="gtxt" placeholder="Heute hatte ich Glück, weil …" maxlength="1000"></textarea>
 <div class="row" style="margin-top:12px"><button class="btn" data-save>🍀 Glück speichern</button></div></div>
 <div id="flash"></div>
 <div id="glist"></div>`;
 renderList();
}
};

/* ---------- Glückskind storage ---------- */
let ENTRIES=[];
try{ENTRIES=JSON.parse(localStorage.getItem("happy-glueck")||"[]")}catch(e){ENTRIES=[]}
function saveLocal(){try{localStorage.setItem("happy-glueck",JSON.stringify(ENTRIES))}catch(e){}}
function persist(){saveLocal()}
function renderList(){
 const el=document.getElementById("glist");if(!el)return;
 const n=ENTRIES.length;
 if(!n){el.innerHTML=`<p class="count">Deine Glücksliste</p><div class="empty">Hier wächst bald deine Sammlung an Glücksmomenten. Schreib oben den ersten auf.</div>`;return}
 const sorted=[...ENTRIES].sort((a,b)=>b.at-a.at);
 el.innerHTML=`<p class="count">${n===1?"1 Glücksmoment":n+" Glücksmomente"} gesammelt</p>
 <div class="row" style="margin:0 0 14px">${n>2?`<button class="btn ghost" data-random>🎁 Zufälligen Glücksmoment ziehen</button>`:""}<button class="btn ghost" data-export>💾 Liste sichern</button></div>
 <ul class="entries">${sorted.map(e=>`<li class="entry"><div><div class="when">${new Date(e.at).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"long",year:"numeric"})}</div><div class="txt">${esc(e.t)}</div></div><button class="del" aria-label="Eintrag löschen" data-del="${e.id}">✕</button></li>`).join("")}</ul>`;
}
function confetti(){const box=document.createElement("div");box.className="confetti";const cs=["#ff5a6e","#ffcf33","#22b8a7","#4d8dff","#9b5cf6","#ff9f1c"];
 for(let i=0;i<40;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=cs[i%cs.length];p.style.animationDelay=Math.random()*.4+"s";box.appendChild(p)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),2200)}



/* ---------- Landscape generator ---------- */
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647,(s-1)/2147483646)}
function ridge(r,base,amp,freq,W,H){let pts=[],p1=r()*6,p2=r()*6,p3=r()*6;for(let i=0;i<=60;i++){const x=i/60*W;const y=base-amp*(.55*Math.sin(x/W*Math.PI*freq+p1)+.3*Math.sin(x/W*Math.PI*freq*2.3+p2)+.15*Math.sin(x/W*Math.PI*freq*5.1+p3));pts.push([x,y])}return pts}
function poly(pts,W,H){return "M0,"+H+" L"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L")+" L"+W+","+H+" Z"}
function sceneSVG(s){
 const W=400,H=300,r=rng(Math.floor(Math.random()*1e9)),id="g"+Math.floor(r()*1e6);
 const horizon=s.water?205:H;
 let o=`<svg class="scene" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(s.n)}"><defs>
 <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.sky[0]}"/><stop offset=".6" stop-color="${s.sky[1]}"/><stop offset="1" stop-color="${s.sky[2]}"/></linearGradient>
 <radialGradient id="${id}g"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dffb2" stop-opacity="0"/><stop offset=".5" stop-color="#5dffa8" stop-opacity=".75"/><stop offset="1" stop-color="#2fd1ff" stop-opacity="0"/></linearGradient>
 <linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.water||"#000"}" stop-opacity=".75"/><stop offset="1" stop-color="${s.water||"#000"}"/></linearGradient>
 <filter id="${id}b"><feGaussianBlur stdDeviation="6"/></filter>
 <linearGradient id="${id}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
 </defs><rect width="${W}" height="${H}" fill="url(#${id}s)"/>`;
 if(s.stars){for(let i=0;i<110;i++){o+=`<circle cx="${(r()*W).toFixed(1)}" cy="${(r()*170).toFixed(1)}" r="${(r()*1.2+.3).toFixed(2)}" fill="#fff" opacity="${(r()*.7+.3).toFixed(2)}"/>`}}
 if(s.milky){o+=`<ellipse cx="200" cy="90" rx="230" ry="26" transform="rotate(-28 200 90)" fill="#d9c7ff" opacity=".22" filter="url(#${id}b)"/>`;for(let i=0;i<160;i++){const t=r()*2-1,x=200+t*230,y=90-t*230*Math.tan(28*Math.PI/180)+(r()-.5)*40;o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r()*.9+.2).toFixed(2)}" fill="#fff" opacity="${(r()*.6+.3).toFixed(2)}"/>`}}
 if(s.aurora){for(let k=0;k<3;k++){let d="M-20,"+(60+k*18);for(let i=0;i<=8;i++){d+=` Q${i*55-10},${40+k*20+r()*50} ${i*55+20},${60+k*18+r()*20}`}o+=`<path d="${d}" stroke="url(#${id}a)" stroke-width="${38-k*8}" fill="none" opacity="${.8-k*.2}" filter="url(#${id}b)"/>`}}
 if(s.sun){o+=`<circle cx="${s.sun.x}" cy="${s.sun.y}" r="${s.sun.r*3.2}" fill="url(#${id}g)" opacity=".7"/><circle cx="${s.sun.x}" cy="${s.sun.y}" r="${s.sun.r}" fill="${s.sun.c}"/>`}
 const L=s.layers.length;
 s.layers.forEach((c,i)=>{
  const t=L===1?1:i/(L-1);
  let base,amp,freq;
  if(s.dunes){base=horizon-70+t*60;amp=26-t*6;freq=1.4+t}
  else if(s.steep){base=horizon-75+t*30;amp=70-t*20;freq=1.6+t*1.2}
  else if(s.field){base=horizon-95+t*30;amp=14;freq=1.2}
  else if(s.blossom){base=horizon-110+t*55;amp=20;freq=1.3+t*.6}
  else if(s.water&&L===1){base=horizon+2;amp=28;freq=1;}
  else{base=horizon-110+t*70;amp=60-t*30;freq=1.5+t*1.4}
  const pts=ridge(r,base,amp,freq,W,H);
  o+=`<path d="${poly(pts,W,horizon)}" fill="${c}"/>`;
  if(s.mist&&i<L-1)o+=`<rect x="0" y="${base-10}" width="${W}" height="${horizon-base+10}" fill="url(#${id}m)" opacity=".7"/>`;
  if(s.pines&&i===L-1){for(let k=0;k<26;k++){const x=r()*W,p=pts[Math.round(x/W*60)],h=18+r()*26;o+=`<path d="M${x-h*.22},${p[1]+6} L${x},${p[1]-h} L${x+h*.22},${p[1]+6}Z" fill="#163223"/>`}}
  if(s.cypress&&i===L-2){for(let k=0;k<7;k++){const x=30+r()*340,p=pts[Math.round(x/W*60)],h=26+r()*16;o+=`<ellipse cx="${x}" cy="${p[1]-h/2+4}" rx="${4+r()*2}" ry="${h/2}" fill="#3e5a2c"/>`}}
  if(s.blossom&&i===L-1){for(let k=0;k<9;k++){const x=20+r()*360,p=pts[Math.round(x/W*60)];o+=`<rect x="${x-1.5}" y="${p[1]-14}" width="3" height="16" fill="#6b4a3a"/>`;for(let m=0;m<9;m++)o+=`<circle cx="${x+(r()-.5)*26}" cy="${p[1]-20+(r()-.5)*16}" r="${5+r()*4}" fill="${["#ff9ec7","#ffc2dc","#ff7fb3"][m%3]}" opacity=".9"/>`}}
 });
 if(s.field){const top=horizon-70;o+=`<rect x="0" y="${top}" width="${W}" height="${H-top}" fill="${s.field[2]}"/>`;for(let row=0;row<16;row++){const y=top+Math.pow(row/16,1.6)*(H-top)+4,rad=1.2+row*.55;for(let x=-5;x<W+5;x+=rad*2.4+1){o+=`<circle cx="${(x+(r()-.5)*2).toFixed(1)}" cy="${(y+(r()-.5)*3).toFixed(1)}" r="${rad.toFixed(1)}" fill="${s.field[row%2]}"/>`}}}
 if(s.water){o+=`<rect x="0" y="${horizon}" width="${W}" height="${H-horizon}" fill="url(#${id}w)"/>`;
  if(s.sun)o+=`<ellipse cx="${s.sun.x}" cy="${horizon+20}" rx="${s.sun.r*1.1}" ry="34" fill="${s.sun.c}" opacity=".45" filter="url(#${id}b)"/>`;
  for(let i=0;i<14;i++){const y=horizon+6+r()*(H-horizon-10),x=r()*W,w=20+r()*70;o+=`<rect x="${x}" y="${y}" width="${w}" height="1.4" rx=".7" fill="#fff" opacity="${(r()*.25+.1).toFixed(2)}"/>`}}
 return o+"</svg>";
}

/* ---------- Events ---------- */
document.addEventListener("click",async e=>{
 const b=e.target.closest("button,[data-go]");if(!b)return;
 if(b.dataset.go){if(b.classList.contains("hb")){b.classList.add("pressed");await new Promise(r=>setTimeout(r,110))}go(b.dataset.go);return}
 if(b.dataset.recipe!==undefined){go("rezept",+b.dataset.recipe);return}
 if(b.hasAttribute("data-surprise")){go("rezept",Math.floor(Math.random()*RECIPES.length));return}
 if(b.dataset.cat){tripCat=b.dataset.cat;lastTrip=-1;VIEWS.ausflug();return}
 if(b.dataset.again){RT++;VIEWS[b.dataset.again]();return}
 if(b.hasAttribute("data-export")){const txt=[...ENTRIES].sort((x,y)=>x.at-y.at).map(e=>new Date(e.at).toLocaleDateString("de-DE")+": "+e.t).join("\n\n");const url=URL.createObjectURL(new Blob(["Meine Glücksmomente 🍀\n\n"+txt],{type:"text/plain"}));const l=document.createElement("a");l.href=url;l.download="gluecksmomente.txt";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
 if(b.hasAttribute("data-copy")){const ta=document.getElementById("prompt");let ok=false;
  try{await navigator.clipboard.writeText(NEWS_PROMPT);ok=true}catch(err){}
  if(!ok){ta.focus();ta.select();try{ok=document.execCommand("copy")}catch(err){}}
  toast(ok?"Kopiert – jetzt einfügen":"Text ist markiert – bitte kopieren");return}
 if(b.hasAttribute("data-save")){const ta=document.getElementById("gtxt");const t=ta.value.trim();
  if(!t){ta.focus();toast("Schreib erst deinen Glücksmoment auf");return}
  ENTRIES.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t,at:Date.now()});persist();ta.value="";
  document.getElementById("flash").innerHTML="";renderList();confetti();toast("Gespeichert 🍀");return}
 if(b.dataset.del){if(confirm("Diesen Glücksmoment löschen?")){ENTRIES=ENTRIES.filter(x=>x.id!==b.dataset.del);persist();renderList()}return}
 if(b.hasAttribute("data-random")){const x=ENTRIES[Math.floor(Math.random()*ENTRIES.length)];
  document.getElementById("flash").innerHTML=`<div class="flash">🎁 Weißt du noch? Am ${new Date(x.at).toLocaleDateString("de-DE",{day:"numeric",month:"long"})}: ${esc(x.t)}</div>`;return}
});
go("home");
</script>
